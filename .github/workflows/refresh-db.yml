name: Refresh prompts.json
on:
  schedule: [{ cron: "0 6 * * *" }]   # every day 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-db.mjs
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add prompts.json
          git diff --staged --quiet || (git commit -m "Refresh prompts.json" && git push)
