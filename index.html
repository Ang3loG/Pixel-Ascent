<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Ascent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{--bg:#0a1222;--panel:#0d1830;--line:#2a3b5f;--ink:#e6edff;--dim:#7d8fb5;--cy:#4cd6ff;--pk:#ff4f7b;--box-shadow:#00000066;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0a1222;--panel:#0d1830;--ink:#e6edff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Silkscreen','Courier New',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,calc((100% - 540px)/2));right:max(10px,calc((100% - 540px)/2));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:3}
.box{background:rgba(10,18,34,.88);border:3px solid var(--line);padding:6px 12px;min-width:104px}
.box small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim)}
.box b{font-family:'VT323',monospace;font-size:30px;font-weight:400;color:var(--cy);line-height:1}
.box.r{text-align:right}.box.r b{color:var(--pk)}
.pips{display:flex;gap:4px;justify-content:center;margin-top:2px}.pips i{width:16px;height:16px;border:2px solid var(--line);background:#0b1426}.pips i.on{background:var(--pk);border-color:#fff}.pips i.done{background:#3a4f7d}
.mid{text-align:center;font-size:10px;letter-spacing:.2em;color:var(--dim)}
#panel{position:absolute;left:max(10px,calc((100% - 540px)/2));right:max(10px,calc((100% - 540px)/2));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4}
.card{background:rgba(10,18,34,.94);border:3px solid var(--line);padding:16px 18px}
.eyebrow{color:var(--pk);font-size:12px;letter-spacing:.3em;margin-bottom:8px}
.q{font-size:24px;font-weight:700;line-height:1.25;margin:0 0 8px;color:#fff}
.hint{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.row{display:flex;gap:10px;align-items:stretch;margin-top:12px}
.ring{--p:100;flex:0 0 62px;height:62px;border-radius:50%;background:conic-gradient(var(--cy) calc(var(--p)*1%),#12203a 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#0a1222}
.ring span{position:relative;font-family:'VT323',monospace;font-size:28px;color:var(--cy)}
input{flex:1;min-width:0;background:#0a1222;border:3px solid #2f8ea8;color:#fff;font-family:'VT323',monospace;font-size:24px;padding:0 10px;border-radius:0;outline:none}
input:focus{border-color:var(--cy)}input::placeholder{color:#556487}
.btn{font-family:'Silkscreen',monospace;font-weight:700;letter-spacing:.2em;font-size:14px;color:#14080f;background:#c93a64;border:3px solid #ff7f9f;border-bottom-width:6px;padding:0 14px;cursor:pointer;border-radius:0}
.btn:active{border-bottom-width:3px;transform:translateY(3px)}
.btn.big{display:block;width:100%;height:64px;color:var(--ink);background:#14213d;border-color:var(--cy);font-size:16px}
.btn.alt{background:#0d1830;color:var(--dim);border-color:var(--line);height:48px;font-size:12px;margin-top:10px}
.btn:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.msg{min-height:16px;font-size:11px;letter-spacing:.12em;color:var(--pk);margin-top:8px}
.cf{margin-top:10px;border:2px solid var(--cy);padding:8px 10px;font-size:12px;letter-spacing:.12em;color:var(--cy)}.cfb{display:flex;gap:8px;margin-top:8px}.cfb .btn{height:40px;font-size:11px;flex:1;padding:0 8px}.btn.alt2{background:#0d1830;color:var(--dim);border-color:var(--line)}
.tier{display:inline-block;padding:3px 8px;font-size:12px;letter-spacing:.2em;color:#08101f;margin-bottom:8px}
.gain{font-family:'VT323',monospace;font-size:38px;line-height:1;margin:2px 0 8px}
.fact{border-left:4px solid var(--cy);padding:4px 0 4px 12px;margin:10px 0 14px;font-size:14px;line-height:1.55;letter-spacing:.04em}
.fact b{display:block;color:var(--cy);margin-bottom:2px}
#menu,#end{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end;padding:20px max(12px,calc((100% - 540px)/2)) calc(env(safe-area-inset-bottom,0px) + 20px);background:linear-gradient(180deg,rgba(6,12,28,.1),rgba(6,12,28,.88) 55%)}
#catpage{position:absolute;inset:0;z-index:8;background:#0b0a0a;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 24px;-webkit-overflow-scrolling:touch}
.cp-h{font-size:12px;letter-spacing:.3em;color:var(--pk);margin:4px 2px 14px}
.cp-card{background:#1a100c;border:3px solid #3a2418;margin-bottom:14px;cursor:pointer;color:#f1e6dc}
.cp-card:active{transform:translateY(2px)}
.cp-b{height:130px;position:relative;border-bottom:2px solid #3a2418}
.cp-map{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:20px 20px}
.cp-pin{position:absolute;width:12px;height:12px;background:#ff7a3d;box-shadow:0 0 0 4px rgba(255,122,61,.35),0 0 14px #ff7a3d;transform:translate(-50%,-50%)}
.cp-place{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:.2em;color:#f1e6dc;background:rgba(10,6,4,.7);padding:4px 8px;border-left:3px solid #ff7a3d}
.cp-tag{position:absolute;top:10px;right:10px;border:2px solid #ff7a3d;color:#ff7a3d;font-size:10px;letter-spacing:.2em;padding:4px 8px;background:rgba(10,6,4,.7)}
.cp-i{padding:12px 14px 14px}
.cp-t{font-size:20px;letter-spacing:.08em;margin-bottom:6px}
.cp-s{font-size:11px;letter-spacing:.12em;color:#a89080;margin-bottom:12px}
.cp-go{font-size:12px;letter-spacing:.2em;color:#ff7a3d;text-align:right}
h1{font-size:44px;line-height:1;margin:0 0 6px;letter-spacing:.06em;color:#fff;text-shadow:3px 3px 0 var(--pk)}
.sub{font-size:12px;letter-spacing:.18em;color:var(--dim);margin:0 0 22px;line-height:1.7}
.stat{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.1em;padding:8px 0;border-bottom:2px solid #1c2b4a}.stat b{color:var(--cy);font-family:'VT323',monospace;font-size:24px;font-weight:400}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div class="hud">
 <div class="box"><small>ALTITUDE</small><b id="alt">0m</b></div>
 <div class="mid"><div class="pips" id="pips"></div><div id="pl" style="margin-top:6px"></div></div>
 <div class="box r"><small>SCORE</small><b id="sc">0</b></div>
</div>
<div id="menu">
 <h1>PIXEL<br>ASCENT</h1>
 <p class="sub">NAME THINGS. RARER ANSWERS<br>BLAST YOU HIGHER.</p>
 <button class="btn big" id="go">&#9650; BEGIN ASCENT &#9650;</button>
 <div id="cats" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"></div>
 <div class="hint" style="margin-top:14px;text-align:center" id="best"></div>
</div>
<div id="panel" class="hide">
 <div class="card" id="ask">
  <div class="eyebrow" id="ey"></div>
  <p class="q" id="q"></p>
  <div class="hint">&#9650; rarer answers climb higher &#9650;</div>
  <div class="row">
   <div class="ring" id="ring"><span id="tm">30</span></div>
   <input id="in" type="text" placeholder="type one answer…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
   <button class="btn" id="launch">LAUNCH</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="cf hide" id="cf"><div id="cft"></div><div class="cfb"><button class="btn alt2" id="cn">NO, KEEP MINE</button></div></div>
 </div>
 <div class="card hide" id="res"></div>
</div>
<div id="catpage" class="hide"></div>
<div id="end" class="hide"></div>
</div>
<script>
// ---------- DATA: tiers = common | uncommon | rare | epic | legendary ----------
const P=[
["Name a programming language","python,javascript,java,c,c++|rust,go,ruby,php,swift,kotlin,typescript,c#,sql,lua,perl,r|haskell,elixir,scala,clojure,erlang,ocaml,julia,dart,fortran,cobol,lisp,zig,nim,crystal|prolog,forth,smalltalk,ada,racket,f#,scheme,d,apl,assembly|holyc,brainfuck,malbolge,befunge,intercal,whitespace,piet,lolcode,arnoldc,shakespeare"],
["Name a country in Africa","egypt,nigeria,south africa,kenya,morocco,ethiopia,ghana|algeria,tanzania,uganda,senegal,tunisia,libya,sudan,angola,zimbabwe,zambia,cameroon|mali,niger,chad,namibia,botswana,mozambique,madagascar,rwanda,somalia,malawi,benin,togo,mauritania|gabon,gambia,lesotho,eritrea,djibouti,burundi,liberia,sierra leone,guinea,burkina faso,mauritius,congo,democratic republic of the congo,south sudan,ivory coast|eswatini,swaziland,comoros,cabo verde,cape verde,seychelles,sao tome and principe,equatorial guinea,guinea bissau"],
["Name a board or card game","monopoly,chess,checkers,uno,scrabble,poker,clue,risk,go fish|catan,settlers of catan,ticket to ride,carcassonne,pandemic,backgammon,bridge,cribbage,mahjong,codenames,battleship,sorry|azul,wingspan,splendor,dominion,agricola,go,gloomhaven,terraforming mars,7 wonders,seven wonders,hanabi,patchwork,dixit,king of tokyo|twilight imperium,spirit island,brass birmingham,root,scythe,eclipse,arkham horror,through the ages,puerto rico,great western trail|hnefatafl,senet,shogi,xiangqi,tak,rithmomachia,royal game of ur,fanorona,tafl"],
["Name a planet, moon or dwarf planet","mars,earth,jupiter,saturn,venus,mercury,neptune,uranus,pluto,moon|titan,europa,io,ganymede,callisto,enceladus,triton,ceres|phobos,deimos,charon,eris,makemake,haumea,mimas,iapetus,rhea,dione,tethys,oberon,titania|miranda,ariel,umbriel,hyperion,phoebe,nereid,proteus,sedna,quaoar,orcus,gonggong|amalthea,himalia,thebe,puck,larissa,despina,pan,atlas,prometheus,pandora,janus,epimetheus,helene,telesto,calypso,arrokoth,ixion,varuna"],
["Name a musical instrument","guitar,piano,drums,violin,flute,trumpet,saxophone,bass,clarinet|cello,harp,trombone,ukulele,banjo,accordion,harmonica,oboe,xylophone,tuba,mandolin|bassoon,sitar,didgeridoo,bagpipes,theremin,marimba,french horn,zither,glockenspiel,kalimba,djembe,oud,erhu,synthesizer|hurdy gurdy,nyckelharpa,hammered dulcimer,shamisen,duduk,ocarina,glass armonica,balalaika,tabla,santur,kora,mbira,cimbalom|serpent,ondes martenot,hang drum,hardanger fiddle,cristal baschet,waterphone,sackbut,crwth,lithophone,sarrusophone,theorbo"],
["Name a dinosaur","t rex,trex,tyrannosaurus rex,tyrannosaurus,triceratops,velociraptor,stegosaurus,brontosaurus|brachiosaurus,diplodocus,spinosaurus,ankylosaurus,allosaurus,iguanodon,parasaurolophus,pachycephalosaurus|carnotaurus,giganotosaurus,dilophosaurus,compsognathus,gallimimus,therizinosaurus,utahraptor,deinonychus,argentinosaurus,microraptor|kentrosaurus,ouranosaurus,albertosaurus,baryonyx,amargasaurus,sinosauropteryx,oviraptor,corythosaurus,styracosaurus,mamenchisaurus|nasutoceratops,qianzhousaurus,yutyrannus,halszkaraptor,nanuqsaurus,kosmoceratops,irritator,tsintaosaurus,zuul,pegomastax"]
];
const TAG={"Name a musical instrument":"music","Name a band":"music","Name an album":"music","Name a song":"music","Name a music genre":"music","Name a record label":"music","Name an opera":"music","Name a stage musical":"music","Name a symphony":"music","Name a music festival":"music","Name a concert hall":"music","Name a music video":"music","Name a rock band":"music","Name an orchestra":"music","Name a national anthem":"music",
"Name a film":"film","Name a TV show":"film","Name a film franchise":"film","Name a film genre":"film","Name a film studio":"film","Name an animated film":"film","Name a documentary":"film","Name a sitcom":"film","Name a film festival":"film","Name a movie theater":"film","Name a horror film":"film","Name a sci-fi film":"film","Name a TV channel":"film","Name a miniseries":"film","Name a comedy film":"film",
"Name a programming language":"tech","Name a computer company":"tech","Name an operating system":"tech","Name a web browser":"tech","Name a social media platform":"tech","Name a video game console":"tech","Name a search engine":"tech","Name a smartphone":"tech","Name a game engine":"tech","Name a Linux distro":"tech","Name a file format":"tech","Name a robot":"tech","Name a spacecraft":"tech","Name a website":"tech","Name a mobile app":"tech",
"Name a video game":"pop","Name a superhero":"pop","Name a comic book character":"pop","Name a Pokémon":"pop","Name an anime":"pop","Name a toy":"pop","Name a manga":"pop","Name a video game character":"pop","Name a cartoon":"pop","Name a theme park":"pop","Name a meme":"pop","Name a video game series":"pop","Name a magazine":"pop","Name a fictional universe":"pop","Name a roller coaster":"pop"};
const CATS=[["ALL",null],["MUSIC","music"],["FILM & TV","film"],["TECHNOLOGY","tech"],["POP CULTURE","pop"]];
const TIERS=[
 {n:"COMMON",g:150,p:10,c:"#9fb2d6"},{n:"UNCOMMON",g:450,p:30,c:"#6be28a"},{n:"RARE",g:1400,p:100,c:"#4cd6ff"},
 {n:"EPIC",g:4000,p:300,c:"#c58bff"},{n:"LEGENDARY",g:12000,p:1000,c:"#ffcf5a"}];
const UNLISTED={n:"UNLISTED",g:100,p:5,c:"#7d8fb5"};
const M=[
 [20,"A 6-story building","About the height of a 6-story building. The pad crew can barely see you."],
 [100,"Taller than Lady Liberty","The Statue of Liberty is 93 m from ground to torch. You just cleared it."],
 [324,"The Eiffel Tower","324 m is roughly the Eiffel Tower’s height. It was the tallest structure on Earth until 1930."],
 [541,"One World Trade Center","This is the height of One World Trade Center: 541 m, which is exactly 1,776 ft, a nod to the year 1776."],
 [828,"Burj Khalifa","828 m: the Burj Khalifa in Dubai, the tallest building in the world."],
 [1776,"1,776 meters up","You’ve stacked about 3.3 One World Trade Centers. (The tower itself is 1,776 feet, not meters.)"],
 [3776,"Mount Fuji","3,776 m: the summit of Mount Fuji, Japan’s highest mountain."],
 [8849,"Mount Everest","8,849 m: Everest’s summit. Climbers up here carry bottled oxygen."],
 [11000,"Airliner cruising altitude","About 11 km: where most passenger jets cruise. Outside it’s around -55°C."],
 [18900,"The Armstrong limit","Above ~18.9 km, water boils at body temperature. Without a pressure suit, that’s a problem."],
 [50000,"Top of the stratosphere","50 km: the air is about a thousandth as dense as at sea level."],
 [100000,"The Kármán line","100 km: the conventional edge of space. You’re officially an astronaut."],
 [160000,"Low Earth orbit zone","Around 160 km is about the lowest altitude where a satellite can orbit for more than a few days."]];
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9#+ ]/g," ").replace(/\s+/g," ").trim().replace(/^(the|a|an) /,"");
const key=s=>norm(s).replace(/s$/,"").replace(/ /g,"");
const SETS=P.map(p=>p[1].split("|").map(t=>new Set(t.split(",").map(key))));
const ENT=P.map(p=>p[1].split("|").flatMap((t,i)=>t.split(",").map(n=>({n,k:key(n),t:i}))));
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function match(raw){const k=key(raw),L=ENT[S.cur];const ex=L.find(e=>e.k===k);if(ex)return{e:ex,fixed:false};if(k.length<4)return null;const lim=k.length<=5?1:k.length<=8?2:3;let bd=99,be=null;for(const e of L){if(Math.abs(e.k.length-k.length)>lim)continue;const d=lev(k,e.k);if(d<bd||(d===bd&&be&&e.t>be.t)){bd=d;be=e}}return be&&bd<=lim?{e:be,fixed:true}:null}
const fmt=m=>m>=10000?(m/1000).toFixed(1)+"km":Math.round(m).toLocaleString()+"m";
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---------- optional live DB (prompts.json built from Wikidata) ----------
fetch("prompts.json").then(r=>r.ok?r.json():[]).then(db=>{if(!Array.isArray(db))return;for(const d of db){let i=P.findIndex(p=>p[0]===d.q);if(i<0){P.push([d.q,""]);ENT.push([]);i=P.length-1}const have=new Set(ENT[i].map(e=>e.k));for(const [n,t,al] of d.items){for(const nm of [n,...(al||[])]){const k=key(nm);if(!k||have.has(k))continue;have.add(k);ENT[i].push({n,k,t})}}}}).catch(()=>{});
// ---------- state ----------
let S=null,best=0;
try{best=+localStorage.getItem("pa_best")||0}catch(e){}
function showBest(){$("best").textContent=best?"BEST ALTITUDE "+fmt(best):""}showBest();
const pips=$("pips");for(let i=0;i<7;i++)pips.appendChild(document.createElement("i"));
function start(seed,tag){
 const r=rng(seed);let a=P.map((_,i)=>i).filter(i=>!tag||TAG[P[i][0]]===tag);if(!a.length){tag=null;a=P.map((_,i)=>i)}
 for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 S={tag,order:a.slice(0,5),i:0,alt:0,score:0,mode:"ask",used:new Set(),tLeft:30,fly:null,maxM:null,from:0};
 [...pips.children].forEach((p,i)=>p.style.display=i<S.order.length?"":"none");$("menu").classList.add("hide");$("end").classList.add("hide");$("panel").classList.remove("hide");
 nextPrompt();
}
function nextPrompt(){
 const idx=S.order[S.i];S.cur=idx;S.used=new Set();S.tLeft=30;S.mode="ask";clearPend();
 $("ey").textContent="PROMPT "+(S.i+1)+" OF "+S.order.length;$("q").textContent=P[idx][0];
 $("ask").classList.remove("hide");$("res").classList.add("hide");$("in").value="";$("msg").textContent="";
 $("pl").textContent="PROMPT "+(S.i+1)+" OF "+S.order.length;
 [...pips.children].forEach((p,i)=>p.className=i<S.i?"done":i==S.i?"on":"");
 setTimeout(()=>$("in").focus({preventScroll:true}),50);
}
function submit(){
 if(!S||S.mode!=="ask")return;
 const raw=$("in").value.trim();if(!raw)return;
 if(S.pend){acceptFix();return}
 const m=match(raw);
 if(m&&m.fixed){if(S.used.has(m.e.k)){$("msg").textContent="ALREADY USED. TRY ANOTHER.";return}S.pend={m,raw};showConfirm();return}
 if(!m){$("msg").textContent='"'+raw.toUpperCase()+'": not on the list. try again';return}
 finalize(m,raw,false);
}
function finalize(m,raw,fixed){const k=m?m.e.k:key(raw);if(S.used.has(k)){$("msg").textContent="ALREADY USED. TRY ANOTHER.";return}S.used.add(k);resolve(m?TIERS[m.e.t]:UNLISTED,m?m.e.n:raw,fixed?raw:null)}
function clearPend(){if(S)S.pend=null;$("cf").classList.add("hide")}
function showConfirm(){$("msg").textContent="";$("cft").textContent="DID YOU MEAN "+S.pend.m.e.n.toUpperCase()+"? PRESS ENTER TO CONFIRM";$("cf").classList.remove("hide")}
function acceptFix(){const p=S.pend;clearPend();finalize(p.m,p.raw,true)}
function resolve(tier,raw,orig){
 S.mode="fly";$("in").blur();
 const gain=raw===null?0:tier.g;S.score+=raw===null?0:tier.p;
 S.orig=orig||null;S.from=S.alt;S.target=S.alt+gain;S.tier=tier;S.raw=raw;S.gain=gain;
 S.fly={t0:performance.now(),dur:gain?1600+Math.min(1800,gain/6):900};
 $("ask").classList.add("hide");$("panel").classList.add("hide");
}
function timeout(){S.mode="fly";resolve(null,null)}
function arrive(){
 S.alt=S.target;S.fly=null;S.mode="res";
 if(S.alt>best){best=S.alt;try{localStorage.setItem("pa_best",String(Math.round(best)))}catch(e){}}
 let m=null;for(const x of M)if(x[0]>S.from&&x[0]<=S.alt)m=x;
 if(m&&(!S.maxM||m[0]>S.maxM[0]))S.maxM=m;
 const last=S.i>=S.order.length-1,t=S.tier;
 let h;
 if(S.raw===null){
  const le=ENT[S.cur].filter(e=>e.t===4),ls=[le.length?le[Math.floor(Math.random()*le.length)].n:"???"];

 const dt=(now-last)/1000;last=now;
 if(S){
  if(S.mode==="fly"&&S.fly){const t=Math.min(1,(now-S.fly.t0)/S.fly.dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;S.alt=S.from+(S.target-S.from)*e;if(t>=1)arrive()}
  if(S.mode==="ask"){S.tLeft-=dt;if(S.tLeft<=0){S.tLeft=0;timeout()}
   const s=Math.ceil(S.tLeft);$("tm").textContent=s;$("ring").style.setProperty("--p",S.tLeft/30*100)}
  $("alt").textContent=fmt(S.alt);$("sc").textContent=S.score;
 }
 draw(now);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
